  metric_answer_rel_error: "repo_file:tests/test_metric_calibration.py"
  retired_x10_rel_error: "repo_file:tests/test_metric_calibration.py"
  grounded_label_coverage: "repo_file:tests/test_correspondence_grounding.py"
  inlier_ratio_mean: "repo_file:tests/test_correspondence_grounding.py"
  unusable_extrinsics_accept_rate: "repo_file:tests/test_prompts.py"
  real_registration_spread_ratio: "user_guidance"
